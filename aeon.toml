title = "Three provable axioms"
body = "Positivity (P(i) > 0 — the sliver, +1 from Landauer heat), normalization (sum P = 1 by construction), and monotonicity (less void = more weight). All mechanized in Lean 4 with zero sorry."

[[site.features]]
