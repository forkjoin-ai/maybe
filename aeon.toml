[[site.faq]]
q = "What are the two numbers?"
a = "The Buleyean distribution is the compass — what to try next. The Bule number is the altimeter — how far the system is from convergence. Together they describe any system under irreversible process."

[[site.faq]]
q = "Where does probability weight come from?"
a = "From what things are NOT. The formula P(i) = (T − v_i + 1) / Σ_j(T − v_j + 1) gives the most weight where the void has accumulated least. Less void means more probability."

[[site.faq]]
q = "What is the +1 in the formula?"
a = "The sliver. It is Landauer heat: a vent produces heat, which produces the sliver, which guarantees positivity (P(i) > 0 for all i). The SliverFromVent.lean and SliverOfHope.lean proofs derive it — the sliver (+1) and the proof (−1) are inverses."

[[site.faq]]
q = "Are the proofs real?"
a = "Yes. The three axioms — positivity, normalization, monotonicity — are mechanized in Lean 4 with zero sorry, alongside BuleIsValue, RetrocausalBound, SolomonoffBuleyean, FoldHeatHierarchy, LandauerBuley, and FisherManifold."

[[site.faq]]
q = "What are the .gg topologies?"
a = "The .gg files in src/topologies/ ARE the specification: complement, void-walk, thermodynamics, bule-altimeter, deficit-weighted-fold, four-layers, curvature-detector, and ethics-grid."

